services:
  postgres:
    image: postgres:16-alpine
    container_name: encounter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encounters
    ports:
      - "5432:5432"
    volumes:
      - encounter_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encounters"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  encounter_pgdata:
